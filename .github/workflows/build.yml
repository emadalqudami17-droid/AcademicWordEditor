name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            ccache

      - name: Fix pip for p4a compatibility
        run: |
          # حل مشكلة open_rich_spinner
          pip install --upgrade "pip<24.1" "setuptools<70" "wheel"
          python -m pip --version

      - name: Install buildozer
        run: |
          pip install "cython<3.0"
          pip install "buildozer==1.5.0"
          pip install "python-for-android==2024.1.21"

      - name: Clear stale cache
        run: |
          rm -rf ~/.buildozer .buildozer 2>/dev/null || true

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academicword-apk
          path: bin/*.apk
          retention-days: 30
