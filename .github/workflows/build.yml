name: Build Android APK

on:
  # Auto-build disabled - use manual trigger only
  # push:
  #   branches: [ main ]

  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify Python version
        run: |
          echo "=== Python version ==="
          python --version
          which python
          python3 --version
          echo "=== End ==="

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            ccache

      - name: Install buildozer
        run: |
          pip install --upgrade "pip<24.1"
          pip install "cython<3.0"
          pip install "buildozer==1.5.0"
          pip install "python-for-android==2024.1.21"

      - name: Clear stale cache
        run: |
          rm -rf ~/.buildozer .buildozer 2>/dev/null || true

      - name: Build with Buildozer
        env:
          PYTHON: /opt/hostedtoolcache/Python/3.11.9/x64/bin/python3
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academicword-apk
          path: bin/*.apk
          retention-days: 30
