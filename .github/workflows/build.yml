name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            ccache

      - name: Verify Python version
        run: |
          python --version
          which python

      - name: Install buildozer & p4a
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer
          pip install "python-for-android==2024.1.21"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build with Buildozer
        env:
          # إجبار استخدام Python 3.11
          PYTHON: /opt/hostedtoolcache/Python/3.11.9/x64/bin/python3
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academicword-apk
          path: bin/*.apk
          retention-days: 30
